# DermAI Nginx Reverse Proxy Configuration

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Upstream Services
    upstream tomcat_app {
        server 127.0.0.1:9999;
    }

    upstream payment_api {
        server 127.0.0.1:3000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Node.js Payment API Routes
        location /api/ {
            proxy_pass http://payment_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # VNPay Callback Route
        location ^~ /payments/vnpay/ {
            proxy_pass http://payment_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default UI & Java Servlet Route (Tomcat on port 9999)
        location / {
            proxy_pass http://tomcat_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
