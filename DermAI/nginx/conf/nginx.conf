worker_processes 1;

# Đặt error log và pid file ở temp directory của Windows
error_log temp/error.log;
pid temp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # Đặt temp paths trong thư mục nginx
    client_body_temp_path temp/client_body_temp;
    proxy_temp_path temp/proxy_temp;
    fastcgi_temp_path temp/fastcgi_temp;
    uwsgi_temp_path temp/uwsgi_temp;
    scgi_temp_path temp/scgi_temp;

    upstream dermai_tomcat {
        # Derma IntelliJ Tomcat (not default 8080)
        server 127.0.0.1:9999;
    }

    upstream dermai_payment_api {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # Payment API endpoints - phải đặt trước /api/ generic
        location ^~ /api/invoices/ {
            proxy_pass http://dermai_payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/payments/ {
            proxy_pass http://dermai_payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /api/health {
            proxy_pass http://dermai_payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /payments/vnpay/ {
            proxy_pass http://dermai_payment_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://dermai_tomcat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
